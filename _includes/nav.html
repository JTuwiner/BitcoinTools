<nav class="navbar navbar-expand-xl navbar-light fixed-top navbar-custom {% if page.nav-short %}top-nav-short-permanent{% else %}top-nav-regular{% endif %}">

<a href="https://bitbo.io/" aria-current="page" class="bitbo-logo-nav-link navbar-item logo-icon nuxt-link-exact-active nuxt-link-active"><img src="https://assets.bitbo.io/img/logos/bitbo-logo.svg" class="icon"> <img src="https://assets.bitbo.io/img/logos/bitbo-logo-text-white-alt2.svg" class="text"></a>


  <style>
    @media (max-width: 1200px) {
      .desktop-nav {
        display: none;
      }
      .mobile-nav {
        display: block;
      }
    }
    @media (min-width: 1201px) {
      .desktop-nav {
        display: block;
      }
      .mobile-nav {
        display: none;
      }
    }

    /* Hide US-only tools until Cloudflare country is known, then keep them hidden outside the US. */
    html.geo-pending [data-us-only],
    html.geo-non-us [data-us-only] {
      display: none !important;
    }

    [data-non-us-only] {
      display: none !important;
    }

    html.geo-non-us [data-non-us-only] {
      display: inline !important;
    }
  </style>

  <div class="collapse navbar-collapse desktop-nav" id="main-navbar">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a target="_blank" class="bitbo-charts-link nav-link" href="https://charts.bitbo.io/index/">Charts</a>
      </li>
      <li class="nav-item">
        <a target="_blank" class="nav-link buy-nav-link" href="https://bitbo.io/buy/usa/">Buy BTC</a>
      </li>
      <li class="nav-item">
        <a target="_blank" class="nav-link" href="https://bitbo.io/hardware-wallets/">Hardware Wallets</a>
      </li>
      <li class="nav-item">
        <a target="_blank" class="nav-link" href="https://bitbo.io/tools/tax/">Crypto Tax Software</a>
      </li>
      <li class="nav-item">
        <a target="_blank" class="nav-link" href="https://bitbo.io/tools/loans/">Loans</a>
      </li>
    </ul>
  </div>

  <div class="mobile-nav">
    {% include mobilenav.html %}
  </div>

  <script>
    (function () {
      var slugs = {
        AR: "argentina", AU: "australia", AT: "austria", BH: "bahrain", BE: "belgium",
        BR: "brazil", CA: "canada", CO: "colombia", DK: "denmark", FR: "france",
        DE: "germany", GR: "greece", HT: "haiti", HK: "hong-kong", HU: "hungary",
        IE: "ireland", IL: "israel", IT: "italy", JM: "jamaica", KW: "kuwait",
        MY: "malaysia", MX: "mexico", NL: "netherlands", NZ: "new-zealand", NO: "norway",
        OM: "oman", PE: "peru", PH: "philippines", PL: "poland", PT: "portugal",
        QA: "qatar", RO: "romania", SA: "saudi-arabia", SG: "singapore", ZA: "south-africa",
        ES: "spain", SE: "sweden", CH: "switzerland", TH: "thailand", AE: "uae",
        GB: "uk", UK: "uk", UY: "uruguay", US: "usa"
      };

      function applyCountry(code) {
        var upper = (code || "").toUpperCase();
        var slug = slugs[upper] || "usa";
        var href = "https://bitbo.io/buy/" + slug + "/";
        var links = document.querySelectorAll(".buy-nav-link");
        for (var i = 0; i < links.length; i++) links[i].href = href;

        if (upper && upper !== "US") {
          document.documentElement.classList.add("geo-non-us");
        }
        document.documentElement.classList.remove("geo-pending");
      }

      document.documentElement.classList.add("geo-pending");

      // loc in /cdn-cgi/trace is Cloudflare's CF-IPCountry header.
      // Unknown or failed lookups stay on the US buy link and show US-only tools.
      fetch("/cdn-cgi/trace", { credentials: "omit" })
        .then(function (res) { return res.ok ? res.text() : ""; })
        .then(function (text) {
          var match = text && text.match(/(?:^|\n)loc=([A-Za-z0-9]{2})/);
          if (match) applyCountry(match[1]);
          else document.documentElement.classList.remove("geo-pending");
        })
        .catch(function () {
          document.documentElement.classList.remove("geo-pending");
        });
    })();
  </script>

  {% if site.navbar-extra %}
    {% for file in site.navbar-extra %}
      {% include {{ file }} %}
    {% endfor %}
  {% endif %}

</nav>
